name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-and-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover
      - run: python -m demo --scenario brute_force --reset
      - run: python -m replay scenario brute_force
